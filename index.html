<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Current — Aventura no Rio Acre</title><style>
*{box-sizing:border-box}body{margin:0;background:#071a20;color:#fff;font-family:system-ui,Arial;text-align:center}header{padding:12px}h1{font-size:clamp(22px,4vw,38px);margin:6px;color:#ffd36b}p{margin:6px}canvas{display:block;width:min(96vw,620px);height:auto;max-height:70vh;aspect-ratio:3/4;margin:auto;border:3px solid #e6c57c;border-radius:12px;background:#17586a;touch-action:none}button{border:0;border-radius:12px;background:#f7c75d;color:#15202a;font-weight:bold;padding:12px 22px;margin:7px;cursor:pointer}#pad{position:fixed;bottom:12px;left:12px;width:118px;height:118px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff70;touch-action:none;display:none}#nub{position:absolute;width:44px;height:44px;border-radius:50%;background:#ffd36b;left:35px;top:35px;pointer-events:none}@media(pointer:coarse){#pad{display:block}}#status{font-size:14px;min-height:24px}
</style></head><body><header><h1>CURRENT — Aventura no Rio Acre</h1><p>Fase 1: Assis Brasil → Brasiléia</p><div id="status">Setas / WASD ou direcional virtual • Enter para iniciar</div><button id="start">Iniciar aventura / Reiniciar</button></header><canvas id="game" width="480" height="640" aria-label="Corrida no Rio Acre"></canvas><div id="pad"><div id="nub"></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),statusEl=document.getElementById('status'),pad=document.getElementById('pad'),nub=document.getElementById('nub');
let state='menu',last=0,progress=0,score=0,life=3,elapsed=0,inv=0,spawn=0,objects=[],rivals=[],keys={},joy={x:0,y:0};
const player={x:240,y:485,w:24,h:46};const total=6500;
function banks(y){let bend=65*Math.sin((progress+y*1.3)/520)+24*Math.sin((progress+y)/180);return {left:65+bend,right:415+bend}}
function reset(){state='playing';progress=0;score=0;life=3;elapsed=0;inv=0;spawn=0;objects=[];rivals=[{x:185,y:270,speed:110,color:'#ff7867'},{x:310,y:110,speed:125,color:'#a1e4ff'},{x:245,y:-80,speed:135,color:'#e9aaff'}];player.x=240;player.y=485;statusEl.textContent='Desvie de troncos e pedras! Correnteza acelera a descida.'}
document.getElementById('start').onclick=reset;window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.key==='Enter'&&state!=='playing')reset()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function padMove(e){let r=pad.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y)||1,m=Math.min(42,d);joy.x=x/d*m/42;joy.y=y/d*m/42;nub.style.transform='translate('+joy.x*42+'px,'+joy.y*42+'px)'}
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);padMove(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)padMove(e)});function release(){joy.x=joy.y=0;nub.style.transform='translate(0,0)'}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);
function collision(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)*.42&&Math.abs(a.y-b.y)<(a.h+b.h)*.43}
function update(dt){if(state!=='playing')return;elapsed+=dt;inv=Math.max(0,inv-dt);let drift=Math.sin(progress/270)*24;let dx=(Number(!!keys.arrowright||!!keys.d)-Number(!!keys.arrowleft||!!keys.a)+joy.x),dy=(Number(!!keys.arrowdown||!!keys.s)-Number(!!keys.arrowup||!!keys.w)+joy.y);let mag=Math.max(1,Math.hypot(dx,dy));player.x+=(dx/mag*220+drift)*dt;player.y+=dy/mag*180*dt;player.y=Math.max(145,Math.min(555,player.y));let b=banks(player.y);player.x=Math.max(b.left+17,Math.min(b.right-17,player.x));let speed=170+30*Math.sin(progress/240);progress+=speed*dt;score+=Math.floor(dt*14);spawn+=dt;if(spawn>.8){spawn=0;let yy=-55,bb=banks(yy);objects.push({x:bb.left+30+Math.random()*(bb.right-bb.left-60),y:yy,w:Math.random()<.5?33:48,h:28,type:Math.random()<.5?'rock':'log'})}for(let o of objects){o.y+=(speed+80)*dt;if(inv<=0&&collision(player,o)){life--;inv=1.5;score=Math.max(0,score-120);if(life<=0)state='lost'}}objects=objects.filter(o=>o.y<700);for(let r of rivals){r.y+=(speed-r.speed)*dt;r.x+=Math.sin(elapsed*1.4+r.speed)*27*dt;let rb=banks(r.y);r.x=Math.max(rb.left+20,Math.min(rb.right-20,r.x));if(inv<=0&&collision(player,{...r,w:25,h:45})){life--;inv=1.5;if(life<=0)state='lost'}if(r.y>730){r.y=-120;r.x=240}}if(progress>=total){state='won';score+=life*300+Math.max(0,Math.floor(900-elapsed*4))}statusEl.textContent='Vidas: '+life+'  •  Pontos: '+score+'  •  Progresso: '+Math.min(100,Math.floor(progress/total*100))+'%'}
function boat(x,y,color){ctx.save();ctx.translate(x,y);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(15,-13);ctx.lineTo(12,19);ctx.quadraticCurveTo(0,35,-12,19);ctx.lineTo(-15,-13);ctx.closePath();ctx.fill();ctx.fillStyle='#3a2620';ctx.fillRect(-6,-9,12,22);ctx.fillStyle='#ffdb9d';ctx.beginPath();ctx.arc(0,-6,6,0,7);ctx.fill();ctx.restore()}
function draw(){ctx.clearRect(0,0,480,640);ctx.fillStyle='#174c2b';ctx.fillRect(0,0,480,640);ctx.fillStyle='#286a38';for(let y=-30;y<680;y+=45){let b=banks(y);for(let side of [b.left-30,b.right+30]){ctx.beginPath();ctx.arc(side+8*Math.sin(y+progress/100),y,18,0,7);ctx.fill()}}ctx.beginPath();for(let y=-5;y<=645;y+=5){let b=banks(y);if(y===-5)ctx.moveTo(b.left,y);else ctx.lineTo(b.left,y)}for(let y=645;y>=-5;y-=5)ctx.lineTo(banks(y).right,y);ctx.closePath();ctx.fillStyle='#277c98';ctx.fill();ctx.strokeStyle='#c8aa71';ctx.lineWidth=8;ctx.stroke();ctx.strokeStyle='#a6e3e8';ctx.lineWidth=2;for(let j=0;j<12;j++){let y=(j*72+progress*.8)%720-50,b=banks(y);ctx.beginPath();ctx.moveTo(b.left+55,y);ctx.lineTo(b.left+85,y-10);ctx.stroke()}for(let o of objects){ctx.fillStyle=o.type==='rock'?'#858e8d':'#76502b';ctx.beginPath();ctx.ellipse(o.x,o.y,o.w/2,o.h/2,0,0,7);ctx.fill()}for(let r of rivals)boat(r.x,r.y,r.color);if(inv===0||Math.floor(inv*9)%2===0)boat(player.x,player.y,'#ffe35c');ctx.fillStyle='#09242bdc';ctx.fillRect(12,12,456,45);ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.fillText('ASSIS BRASIL → BRASILÉIA',22,31);ctx.font='13px system-ui';ctx.fillText('❤ '+life+'     ★ '+score+'     '+Math.min(100,Math.floor(progress/total*100))+'%',22,49);if(state!=='playing'){ctx.fillStyle='#03171bba';ctx.fillRect(0,0,480,640);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 34px system-ui';ctx.fillText(state==='menu'?'CURRENT':state==='won'?'CHEGADA!':'FIM DE JOGO',240,290);ctx.font='19px system-ui';ctx.fillText(state==='won'?'Você conquistou a primeira etapa!':state==='lost'?'Tente novamente!':'Enfrente a correnteza do Rio Acre',240,326);ctx.fillText('Clique em Iniciar ou pressione Enter',240,365);ctx.textAlign='left'}}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
