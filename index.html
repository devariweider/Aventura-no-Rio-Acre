<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Current — Aventura no Rio Acre</title><style>
*{box-sizing:border-box}body{margin:0;background:#071a20;color:#fff;font-family:system-ui,Arial;text-align:center}header{padding:12px}h1{font-size:clamp(22px,4vw,38px);margin:6px;color:#ffd36b}p{margin:6px}canvas{display:block;width:min(96vw,620px);height:auto;max-height:70vh;aspect-ratio:3/4;margin:auto;border:3px solid #e6c57c;border-radius:12px;background:#17586a;touch-action:none}button{border:0;border-radius:12px;background:#f7c75d;color:#15202a;font-weight:bold;padding:12px 22px;margin:7px;cursor:pointer}#pad{position:fixed;bottom:12px;left:12px;width:118px;height:118px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff70;touch-action:none;display:none}#nub{position:absolute;width:44px;height:44px;border-radius:50%;background:#ffd36b;left:35px;top:35px;pointer-events:none}@media(pointer:coarse){#pad{display:block}}#status{font-size:14px;min-height:24px}
</style></head><body><header><h1>CURRENT — Aventura no Rio Acre</h1><p>Fase 1: Assis Brasil → Brasiléia</p><div id="status">Setas / WASD ou direcional virtual • Enter para iniciar</div><div id="choose" style="margin:8px auto;max-width:620px"><strong>Escolha sua embarcação:</strong> <button data-craft="kayak">🛶 Caiaque</button><button data-craft="boat">🚤 Barquinho</button><button data-craft="tube">🛟 Boia</button><p id="selected">Selecionado: Caiaque</p></div><button id="start">Iniciar aventura / Reiniciar</button></header><canvas id="game" width="480" height="640" aria-label="Corrida no Rio Acre"></canvas><div id="pad"><div id="nub"></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),statusEl=document.getElementById('status'),pad=document.getElementById('pad'),nub=document.getElementById('nub');
let craft='kayak';document.querySelectorAll('[data-craft]').forEach(b=>b.onclick=()=>{craft=b.dataset.craft;document.getElementById('selected').textContent='Selecionado: '+({kayak:'Caiaque',boat:'Barquinho',tube:'Boia'}[craft]);});let state='menu',last=0,progress=0,score=0,life=3,elapsed=0,inv=0,spawn=0,objects=[],rivals=[],keys={},joy={x:0,y:0};
const player={x:240,y:485,w:24,h:46};const total=6500;
function banks(y){let bend=65*Math.sin((progress+y*1.3)/520)+24*Math.sin((progress+y)/180);return {left:65+bend,right:415+bend}}
function reset(){state='playing';progress=0;score=0;life=3;elapsed=0;inv=0;spawn=0;objects=[];rivals=[{x:185,y:270,speed:110,color:'#ff7867'},{x:310,y:110,speed:125,color:'#a1e4ff'},{x:245,y:-80,speed:135,color:'#e9aaff'}];player.x=240;player.y=485;statusEl.textContent='Desvie de troncos e pedras! Correnteza acelera a descida.'}
document.getElementById('start').onclick=reset;window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.key==='Enter'&&state!=='playing')reset()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function padMove(e){let r=pad.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y)||1,m=Math.min(42,d);joy.x=x/d*m/42;joy.y=y/d*m/42;nub.style.transform='translate('+joy.x*42+'px,'+joy.y*42+'px)'}
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);padMove(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)padMove(e)});function release(){joy.x=joy.y=0;nub.style.transform='translate(0,0)'}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);
function riverClamp(x,y,half=24){const b=banks(y),margin=half+12;return Math.max(b.left+margin,Math.min(b.right-margin,x))}
function collision(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)*.42&&Math.abs(a.y-b.y)<(a.h+b.h)*.43}
function update(dt){if(state!=='playing')return;elapsed+=dt;inv=Math.max(0,inv-dt);let drift=Math.sin(progress/270)*24;let dx=(Number(!!keys.arrowright||!!keys.d)-Number(!!keys.arrowleft||!!keys.a)+joy.x),dy=(Number(!!keys.arrowdown||!!keys.s)-Number(!!keys.arrowup||!!keys.w)+joy.y);let mag=Math.max(1,Math.hypot(dx,dy));player.x+=(dx/mag*220+drift)*dt;player.y+=dy/mag*180*dt;player.y=Math.max(145,Math.min(555,player.y));let b=banks(player.y);player.x=riverClamp(player.x,player.y,24);let speed=170+30*Math.sin(progress/240);progress+=speed*dt;score+=Math.floor(dt*14);spawn+=dt;if(spawn>.8){spawn=0;let yy=-55,bb=banks(yy);objects.push({x:bb.left+65+Math.random()*(bb.right-bb.left-130),y:yy,w:Math.random()<.5?33:48,h:28,type:Math.random()<.5?'rock':'log'})}for(let o of objects){o.y+=(speed+80)*dt;o.x=riverClamp(o.x,o.y,o.w/2+4);if(inv<=0&&collision(player,o)){life--;inv=1.5;score=Math.max(0,score-120);if(life<=0)state='lost'}}objects=objects.filter(o=>o.y<700);for(let r of rivals){r.y+=(speed-r.speed)*dt;r.x+=Math.sin(elapsed*1.4+r.speed)*27*dt;let rb=banks(r.y);r.x=riverClamp(r.x,r.y,24);if(inv<=0&&collision(player,{...r,w:25,h:45})){life--;inv=1.5;if(life<=0)state='lost'}if(r.y>730){r.y=-120;r.x=riverClamp(240,r.y,24)}}if(progress>=total){state='won';score+=life*300+Math.max(0,Math.floor(900-elapsed*4))}statusEl.textContent='Vidas: '+life+'  •  Pontos: '+score+'  •  Progresso: '+Math.min(100,Math.floor(progress/total*100))+'%'}
function boat(x,y,color,kind='kayak'){
 ctx.save();ctx.translate(x,y);
 // Sombra de contato e ondulação sob o casco.
 ctx.fillStyle='#062c3d77';ctx.beginPath();ctx.ellipse(5,11,kind==='tube'?29:23,kind==='tube'?19:37,-.12,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#d1f7f899';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,13,kind==='tube'?27:20,kind==='tube'?21:36,0,.1,Math.PI-.1);ctx.stroke();
 if(kind==='tube'){
  const ring=ctx.createRadialGradient(-8,-7,3,0,4,28);ring.addColorStop(0,'#fff3b6');ring.addColorStop(.45,color);ring.addColorStop(1,'#985622');
  ctx.fillStyle=ring;ctx.beginPath();ctx.ellipse(0,4,25,23,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#18506b';ctx.beginPath();ctx.ellipse(0,4,12,11,0,0,Math.PI*2);ctx.fill();
 }else{
  const w=kind==='boat'?23:16;
  const hull=ctx.createLinearGradient(-w,0,w,0);hull.addColorStop(0,'#503d28');hull.addColorStop(.23,color);hull.addColorStop(.6,'#f5db91');hull.addColorStop(1,'#604c35');
  ctx.fillStyle=hull;ctx.strokeStyle='#21343a';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-34);ctx.bezierCurveTo(w,-28,w+2,13,w*.7,28);ctx.quadraticCurveTo(0,38,-w*.7,28);ctx.bezierCurveTo(-w-2,13,-w,-28,0,-34);ctx.fill();ctx.stroke();
  ctx.fillStyle='#2c3435';ctx.beginPath();ctx.ellipse(0,6,w*.65,21,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#a77444';ctx.fillRect(-w*.65,19,w*1.3,4);
 }
 // Corpo humano com volume, braços e colete.
 ctx.fillStyle='#293b42';ctx.beginPath();ctx.ellipse(-5,20,5,12,-.2,0,7);ctx.ellipse(5,20,5,12,.2,0,7);ctx.fill();
 ctx.strokeStyle='#bc815d';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-10,-1);ctx.lineTo(-17,9+Math.sin(elapsed*5)*3);ctx.moveTo(10,-1);ctx.lineTo(17,9-Math.sin(elapsed*5)*3);ctx.stroke();
 const vest=ctx.createLinearGradient(-12,0,12,0);vest.addColorStop(0,'#a75517');vest.addColorStop(.45,'#ffb32b');vest.addColorStop(1,'#d77b17');
 ctx.fillStyle=vest;ctx.beginPath();ctx.moveTo(-10,-5);ctx.quadraticCurveTo(0,-9,10,-5);ctx.lineTo(9,15);ctx.quadraticCurveTo(0,20,-9,15);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#fff0b8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(0,16);ctx.stroke();
 ctx.fillStyle='#b97e57';ctx.beginPath();ctx.ellipse(0,-13,8,10,0,0,7);ctx.fill();
 ctx.fillStyle='#30241f';ctx.beginPath();ctx.ellipse(0,-17,8,5,0,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3,-12,1.2,0,7);ctx.arc(3,-12,1.2,0,7);ctx.fill();
 if(kind==='kayak'){ctx.strokeStyle='#d7b98a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-22,14);ctx.lineTo(22,-13);ctx.stroke();ctx.fillStyle='#344c56';ctx.fillRect(-27,13,10,5);ctx.fillRect(18,-17,10,5)}
 ctx.restore();
}

// Floresta amazônica em perspectiva 2.5D: troncos, copas, sombras e profundidade.
// As árvores são decorativas, sem colisão, e o desenho usa apenas Canvas 2D.
function tree3d(x,y,scale,seed){
 const h=28*scale,rad=19*scale;
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle='#0b291d66';ctx.beginPath();ctx.ellipse(10*scale,8*scale,rad*1.2,rad*.42,-.35,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#5d3923';ctx.beginPath();ctx.moveTo(-4*scale,5*scale);ctx.lineTo(-3*scale,-h);ctx.lineTo(3*scale,-h);ctx.lineTo(5*scale,5*scale);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#9b6b3f';ctx.lineWidth=Math.max(1,scale);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-h);ctx.stroke();
 const palm=seed%6===0;
 if(palm){
  ctx.strokeStyle='#2e6c30';ctx.lineWidth=5*scale;
  for(let i=0;i<7;i++){let a=i*Math.PI*2/7;ctx.beginPath();ctx.moveTo(0,-h);ctx.quadraticCurveTo(Math.cos(a)*rad*.8,-h+Math.sin(a)*rad*.5,Math.cos(a)*rad*1.65,-h+Math.sin(a)*rad*.9+6*scale);ctx.stroke()}
 }else{
  const colors=['#184d29','#226738','#307c3e','#3d8a45','#275f32'];
  for(let i=0;i<6;i++){let a=i*2.399+seed,px=Math.cos(a)*rad*.54,py=-h+Math.sin(a)*rad*.37;
   ctx.fillStyle=colors[(seed+i)%colors.length];ctx.beginPath();ctx.ellipse(px,py,rad*(.64+(i%3)*.08),rad*.58,-.25,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#4a995044';ctx.beginPath();ctx.ellipse(-rad*.3,-h-rad*.3,rad*.65,rad*.3,-.4,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function drawForest(){
 // Profundidade por escala; espaçamento e posição estáveis durante a descida.
 const offset=progress*.54;
 for(let row=0;row<19;row++){
  const y=((row*53+offset)%780)-70,b=banks(y);
  for(let side=0;side<2;side++){
   const seed=row*17+side*41;
   for(let depth=2;depth>=0;depth--){
    const x=(side===0?b.left-19-depth*27:b.right+19+depth*27)+Math.sin(seed+depth*9)*7;
    const scale=(.76+Math.max(0,y)/640*.48)*(1-depth*.16);
    tree3d(x,y,scale,seed+depth);
   }
  }
 }
}

function draw(){ctx.clearRect(0,0,480,640);ctx.fillStyle='#174c2b';ctx.fillRect(0,0,480,640);ctx.fillStyle='#245b32';for(let y=-50;y<700;y+=25){let b=banks(y);ctx.fillRect(0,y,Math.max(0,b.left),26);ctx.fillRect(b.right,y,480-b.right,26)}drawForest();ctx.beginPath();for(let y=-5;y<=645;y+=5){let b=banks(y);if(y===-5)ctx.moveTo(b.left,y);else ctx.lineTo(b.left,y)}for(let y=645;y>=-5;y-=5)ctx.lineTo(banks(y).right,y);ctx.closePath();ctx.fillStyle='#277c98';ctx.fill();ctx.strokeStyle='#c8aa71';ctx.lineWidth=8;ctx.stroke();ctx.strokeStyle='#a6e3e8';ctx.lineWidth=2;for(let j=0;j<12;j++){let y=(j*72+progress*.8)%720-50,b=banks(y);ctx.beginPath();ctx.moveTo(b.left+55,y);ctx.lineTo(b.left+85,y-10);ctx.stroke()}for(let o of objects){if(o.type==='log'){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(-.22);ctx.fillStyle='#684025';ctx.fillRect(-o.w/2,-o.h/3,o.w,o.h*.66);ctx.fillStyle='#9c6535';ctx.beginPath();ctx.ellipse(-o.w/2,0,6,o.h/3,0,0,7);ctx.fill();ctx.strokeStyle='#3d281a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(-o.w/2,0,3,o.h/5,0,0,7);ctx.stroke();ctx.strokeStyle='#b6814b';for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(-o.w/3,-5+k*5);ctx.lineTo(o.w/2-4,-5+k*5);ctx.stroke()}ctx.restore()}else{ctx.fillStyle='#808b8b';ctx.beginPath();ctx.moveTo(o.x-o.w/2,o.y+o.h/3);ctx.lineTo(o.x-o.w/3,o.y-o.h/3);ctx.lineTo(o.x+o.w/4,o.y-o.h/2);ctx.lineTo(o.x+o.w/2,o.y+o.h/3);ctx.closePath();ctx.fill();ctx.strokeStyle='#c1c8c2';ctx.stroke()}}for(let r of rivals)boat(r.x,r.y,r.color);if(inv===0||Math.floor(inv*9)%2===0)boat(player.x,player.y,'#ffe35c',craft);ctx.fillStyle='#09242bdc';ctx.fillRect(12,12,456,45);ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.fillText('ASSIS BRASIL → BRASILÉIA',22,31);ctx.font='13px system-ui';ctx.fillText('❤ '+life+'     ★ '+score+'     '+Math.min(100,Math.floor(progress/total*100))+'%',22,49);if(state!=='playing'){ctx.fillStyle='#03171bba';ctx.fillRect(0,0,480,640);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 34px system-ui';ctx.fillText(state==='menu'?'CURRENT':state==='won'?'CHEGADA!':'FIM DE JOGO',240,290);ctx.font='19px system-ui';ctx.fillText(state==='won'?'Você conquistou a primeira etapa!':state==='lost'?'Tente novamente!':'Enfrente a correnteza do Rio Acre',240,326);ctx.fillText('Clique em Iniciar ou pressione Enter',240,365);ctx.textAlign='left'}}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
