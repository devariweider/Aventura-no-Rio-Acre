function riverCenter(y){const z=(progress+y*1.3);const intensity=.75+.55*Math.min(1,progress/total);return 240+intensity*(65*Math.sin(z/550)+38*Math.sin(z/260)+17*Math.sin(z/120))}

let audioCtx=null,audioNext=0,audioStep=0,ambientNext=0,lastImpact=0;
const musicToggle=document.getElementById('music-on'),effectsToggle=document.getElementById('effects-on');
function audioReady(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return true}catch(e){return false}}
function tone(freq,duration=.12,type='sine',volume=.045,when=0,slide=0){
 if(!audioCtx)return;let now=audioCtx.currentTime+when,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();

 gain.gain.exponentialRampToValueAtTime(.0001,now+duration);

}
function soundImpact(type){if(!effectsToggle.checked||!audioReady())return;

 if(type==='log'){tone(150,.18,'triangle',.11,0,-90);tone(85,.23,'sine',.07,.03,-40)}

}
// Trilha eletrônica amazônica: baixo, bumbo, caixa, chimbal e arpejos sem downloads.
function drum(when,kind){
 if(!audioCtx)return;
 const t=Math.max(audioCtx.currentTime,when);
 if(kind==='kick'){tone(115,.19,'sine',.19,t-audioCtx.currentTime,-78);tone(55,.12,'triangle',.07,t-audioCtx.currentTime,-25);return}

 const length=kind==='snare'?.13:.045;
 const buffer=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*length),audioCtx.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);
 const noise=audioCtx.createBufferSource();noise.buffer=buffer;
 const filter=audioCtx.createBiquadFilter();filter.type='highpass';filter.frequency.value=kind==='snare'?900:5500;
 const gain=audioCtx.createGain();gain.gain.setValueAtTime(kind==='snare'?.075:.027,t);
 gain.gain.exponentialRampToValueAtTime(.0001,t+length);
 noise.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);noise.start(t);noise.stop(t+length);
}
function audioTick(){
 if(!audioCtx||state!=='playing')return;
 const now=audioCtx.currentTime;
 if(musicToggle.checked){
  // 128 BPM; intensidade aumenta conforme a fase avança.
  const beat=60/128,step=beat/2;
  const bass=[55,55,65.41,73.42,49,49,61.74,65.41];
  const melody=[220,261.63,329.63,392,246.94,293.66,369.99,440];
  if(audioNext<now-.5)audioNext=now;
  let n=0;
  while(audioNext<now+.18&&n++<4){
   const t=Math.max(0,audioNext-now),s=audioStep%16;
   if(s%2===0){drum(audioNext,'kick');tone(bass[Math.floor(audioStep/4)%8],.2,'sawtooth',.075,t)}
   if(s%4===2)drum(audioNext,'snare');
   drum(audioNext,'hat');
   if(s%2===1){const f=melody[Math.floor(audioStep/2)%8];tone(f,.16,'triangle',.04,t);tone(f*2,.095,'sine',.018,t)}
   if(progress/total>.65&&s%4===3)tone(523.25,.12,'square',.016,t);
   audioStep++;audioNext+=step;
  }
 }else audioNext=now;
 if(effectsToggle.checked&&now>=ambientNext){
  tone(90+Math.random()*30,.9,'sine',.009,0,-25);
  if(Math.random()<.55)tone(1100+Math.random()*500,.11,'sine',.012,.25,-350);
  ambientNext=now+1.2+Math.random()*.9;
 }
}

function reset(){document.querySelector('header>p').textContent='Fase '+(stageIndex+1)+': '+stageTitle();shoveCooldown=0;shoveFlash=0;shoveNotice='';shoveNoticeTime=0;audioReady();audioNext=0;audioStep=0;ambientNext=0;state='playing';progress=0;score=0;life=Infinity;slow=0;rank=1;elapsed=0;inv=0;spawn=0;objects=[];rivals=[{x:185,y:270,speed:110,distance:0,color:'#ff7867'},{x:310,y:110,speed:125,distance:0,color:'#a1e4ff'},{x:245,y:-80,speed:135,distance:0,color:'#e9aaff'}];player.x=240;player.y=485;statusEl.textContent='Desvie de troncos e pedras! Correnteza acelera a descida.'}
const shoveMobile=document.createElement('button');shoveMobile.textContent='💥 EMPURRAR';shoveMobile.id='shove-mobile';shoveMobile.style.cssText='position:fixed;right:12px;bottom:22px;z-index:5;background:#ff805b;display:none';document.body.appendChild(shoveMobile);shoveMobile.addEventListener('pointerdown',e=>{e.preventDefault();shove()});if(matchMedia('(pointer:coarse)').matches)shoveMobile.style.display='block';

function padMove(e){let r=pad.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y)||1,m=Math.min(42,d);joy.x=x/d*m/42;joy.y=y/d*m/42;nub.style.transform='translate('+joy.x*42+'px,'+joy.y*42+'px)'}

function readGamepad(){
 const pads=typeof navigator.getGamepads==='function'?Array.from(navigator.getGamepads()):[];
 const gp=pads.find(p=>p&&p.connected);
 if(!gp){gamepadMove.x=gamepadMove.y=0;gamepadStartHeld=false;shoveHeld=false;gamepadName='';gamepadIndicator.textContent='🎮 Controle: não detectado — clique na página e pressione A';return;}
 gamepadName=gp.id||'Controle Xbox';
 const dead=v=>Math.abs(v)<.15?0:Math.sign(v)*(Math.abs(v)-.15)/.85;
 const btn=i=>!!gp.buttons[i]?.pressed;
 const axes=gp.axes||[];
 const x=dead(axes[0]||0),y=dead(axes[1]||0);
 // Alguns controles USB/Android expõem o direcional como eixo 9 (hat switch).
 // Só reconhecemos valores conhecidos; neutro e leituras fora do padrão não movem.
 let hatX=0,hatY=0;
 if(axes.length>9 && Number.isFinite(axes[9])){
  const hat=axes[9],near=v=>Math.abs(hat-v)<0.09;
  if(near(-1))hatY=-1;
  else if(near(0.14286))hatY=1;
  else if(near(-0.42857))hatX=1;
  else if(near(0.71429))hatX=-1;
 }
 gamepadMove.x=Math.max(-1,Math.min(1,x+Number(btn(15))-Number(btn(14))+hatX));
 gamepadMove.y=Math.max(-1,Math.min(1,y+Number(btn(13))-Number(btn(12))+hatY));
 if(shoveMapping){const pressed=gp.buttons.findIndex((b,i)=>i!==0&&i!==9&&b?.pressed);if(pressed>=0){shoveButtonIndex=pressed;localStorage.setItem('current_shove_button',String(pressed));shoveMapping=false;shoveHeld=true;mapButton.textContent='🎮 Configurar botão X (atual: '+pressed+')';statusEl.textContent='Botão X configurado! Aproxime-se de um adversário e pressione X.'}}else{const shoveButton=btn(3)||btn(1)||btn(shoveButtonIndex);if(shoveButton&&!shoveHeld)shove();shoveHeld=shoveButton;}
 const start=btn(9)||btn(0);
 if(start&&!gamepadStartHeld&&state!=='playing'){if(state==='won'&&stageIndex<stages.length-1)stageIndex++;reset();}
 gamepadStartHeld=start;
 gamepadIndicator.textContent='🎮 Xbox detectado: '+gamepadName.slice(0,48)+' | Direção: '+gamepadMove.x.toFixed(1)+', '+gamepadMove.y.toFixed(1)+' | Empurrar: X (B3) ou B (B1)'+(shoveMapping?' (aguardando X)':'');
}

function riverClamp(x,y,half=24){const b=banks(y),margin=half+12;return Math.max(b.left+margin,Math.min(b.right-margin,x))}
function collision(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)*.42&&Math.abs(a.y-b.y)<(a.h+b.h)*.43}
function shove(){if(state!=='playing')return;if(shoveCooldown>0){shoveNotice='AGUARDE '+shoveCooldown.toFixed(1)+'s';shoveNoticeTime=.6;return;}let target=null,dist=85;for(const r of rivals){const d=Math.hypot(r.x-player.x,r.y-player.y);if(d<dist){dist=d;target=r}}if(target){shoveCooldown=4;shoveNotice='💥 CHEGA PRA LÁ! +50';shoveNoticeTime=1.1;const side=Math.sign(target.x-player.x)||1;target.x=riverClamp(target.x+side*52,target.y,24);target.speed=Math.max(35,target.speed*.55);target.stunned=2.2;target.distance=Math.max(0,target.distance-110);shoveFlash=.6;score+=50;if(effectsToggle.checked&&audioReady()){tone(190,.16,'sawtooth',.10,0,-110);tone(320,.12,'triangle',.06,.09,-160)}statusEl.textContent='CHEGA PRA LÁ! +50 pontos';}else{shoveNotice='APROXIME-SE DO ADVERSÁRIO';shoveNoticeTime=1.2;statusEl.textContent='Chegue perto de um adversário para empurrar!'}}
function update(dt){if(state!=='playing')return;shoveCooldown=Math.max(0,shoveCooldown-dt);shoveFlash=Math.max(0,shoveFlash-dt);shoveNoticeTime=Math.max(0,shoveNoticeTime-dt);elapsed+=dt;inv=Math.max(0,inv-dt);let drift=(riverCenter(player.y)-riverCenter(player.y+8))*4+Math.sin(progress/270)*12;let dx=(Number(!!keys.arrowright||!!keys.d)-Number(!!keys.arrowleft||!!keys.a)+joy.x+gamepadMove.x),dy=(Number(!!keys.arrowdown||!!keys.s)-Number(!!keys.arrowup||!!keys.w)+joy.y+gamepadMove.y);let mag=Math.max(1,Math.hypot(dx,dy));player.x+=(dx/mag*220+drift)*dt;player.y+=dy/mag*180*dt;player.y=Math.max(145,Math.min(555,player.y));let b=banks(player.y);player.x=riverClamp(player.x,player.y,24);slow=Math.max(0,slow-dt);let speed=(170+30*Math.sin(progress/240))*(slow>0?.52:1);progress+=speed*dt;score+=Math.floor(dt*14);spawn+=dt;if(spawn>.8){spawn=0;let yy=-55,bb=banks(yy);objects.push({x:bb.left+65+Math.random()*(bb.right-bb.left-130),y:yy,w:Math.random()<.5?33:48,h:28,type:Math.random()<.5?'rock':'log'})}for(let o of objects){o.y+=(speed+80)*dt;o.x=riverClamp(o.x,o.y,o.w/2+4);if(inv<=0&&collision(player,o)){soundImpact(o.type);slow=1.6;inv=1.2;score=Math.max(0,score-35)}}objects=objects.filter(o=>o.y<700);for(let r of rivals){if(r.stunned>0){r.stunned=Math.max(0,r.stunned-dt);if(!r.stunned)r.speed=r.baseSpeed||r.speed}else r.baseSpeed=r.speed;r.distance+=r.speed*dt;r.y+=(speed-r.speed)*dt;r.x+=Math.sin(elapsed*1.4+r.speed)*27*dt;let rb=banks(r.y);r.x=riverClamp(r.x,r.y,24);if(inv<=0&&collision(player,{...r,w:25,h:45})){slow=1.6;inv=1.2}if(r.y>730){r.y=-120;r.x=riverClamp(240,r.y,24)}}rank=1+rivals.filter(r=>r.distance>progress).length;if(progress>=total&&elapsed>=80){state='won';victorySound();localStorage.setItem('current_fase'+(stageIndex+2)+'_liberada','sim');score+=Math.max(0,Math.floor(900-elapsed*4))}statusEl.textContent='Posição: '+rank+'º/4  •  Pontos: '+score+'  •  Progresso: '+Math.min(100,Math.floor(progress/total*100))+'%'+(slow>0?'  •  Impacto!':'')+(shoveCooldown>0?'  •  Empurrão: '+shoveCooldown.toFixed(1)+'s':'  •  💥 X/B pronto')+(gamepadName?'  •  🎮 Conectado':'')}
function boat(x,y,color,kind='kayak'){
 ctx.save();ctx.translate(x,y);
 // Sombra de contato e ondulação sob o casco.
 ctx.fillStyle='#062c3d77';ctx.beginPath();ctx.ellipse(5,11,kind==='tube'?29:23,kind==='tube'?19:37,-.12,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#d1f7f899';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,13,kind==='tube'?27:20,kind==='tube'?21:36,0,.1,Math.PI-.1);ctx.stroke();
 if(kind==='tube'){
  const ring=ctx.createRadialGradient(-8,-7,3,0,4,28);ring.addColorStop(0,'#fff3b6');ring.addColorStop(.45,color);ring.addColorStop(1,'#985622');
  ctx.fillStyle=ring;ctx.beginPath();ctx.ellipse(0,4,25,23,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#18506b';ctx.beginPath();ctx.ellipse(0,4,12,11,0,0,Math.PI*2);ctx.fill();
 }else{
  const w=kind==='boat'?23:16;
  const hull=ctx.createLinearGradient(-w,0,w,0);hull.addColorStop(0,'#503d28');hull.addColorStop(.23,color);hull.addColorStop(.6,'#f5db91');hull.addColorStop(1,'#604c35');
  ctx.fillStyle=hull;ctx.strokeStyle='#21343a';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-34);ctx.bezierCurveTo(w,-28,w+2,13,w*.7,28);ctx.quadraticCurveTo(0,38,-w*.7,28);ctx.bezierCurveTo(-w-2,13,-w,-28,0,-34);ctx.fill();ctx.stroke();
  ctx.fillStyle='#2c3435';ctx.beginPath();ctx.ellipse(0,6,w*.65,21,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#a77444';ctx.fillRect(-w*.65,19,w*1.3,4);
 }
 // Corpo humano com volume, braços e colete.
 ctx.fillStyle='#293b42';ctx.beginPath();ctx.ellipse(-5,20,5,12,-.2,0,7);ctx.ellipse(5,20,5,12,.2,0,7);ctx.fill();
 ctx.strokeStyle='#bc815d';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-10,-1);ctx.lineTo(-17,9+Math.sin(elapsed*5)*3);ctx.moveTo(10,-1);ctx.lineTo(17,9-Math.sin(elapsed*5)*3);ctx.stroke();
 const vest=ctx.createLinearGradient(-12,0,12,0);vest.addColorStop(0,'#a75517');vest.addColorStop(.45,'#ffb32b');vest.addColorStop(1,'#d77b17');
 ctx.fillStyle=vest;ctx.beginPath();ctx.moveTo(-10,-5);ctx.quadraticCurveTo(0,-9,10,-5);ctx.lineTo(9,15);ctx.quadraticCurveTo(0,20,-9,15);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#fff0b8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(0,16);ctx.stroke();
 ctx.fillStyle='#b97e57';ctx.beginPath();ctx.ellipse(0,-13,8,10,0,0,7);ctx.fill();
 ctx.fillStyle='#30241f';ctx.beginPath();ctx.ellipse(0,-17,8,5,0,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3,-12,1.2,0,7);ctx.arc(3,-12,1.2,0,7);ctx.fill();
 if(kind==='kayak'){ctx.strokeStyle='#d7b98a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-22,14);ctx.lineTo(22,-13);ctx.stroke();ctx.fillStyle='#344c56';ctx.fillRect(-27,13,10,5);ctx.fillRect(18,-17,10,5)}

}

// Floresta amazônica em perspectiva 2.5D: troncos, copas, sombras e profundidade.
// As árvores são decorativas, sem colisão, e o desenho usa apenas Canvas 2D.
function tree3d(x,y,scale,seed){
 const h=28*scale,rad=19*scale;
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle='#0b291d66';ctx.beginPath();ctx.ellipse(10*scale,8*scale,rad*1.2,rad*.42,-.35,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#5d3923';ctx.beginPath();ctx.moveTo(-4*scale,5*scale);ctx.lineTo(-3*scale,-h);ctx.lineTo(3*scale,-h);ctx.lineTo(5*scale,5*scale);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#9b6b3f';ctx.lineWidth=Math.max(1,scale);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-h);ctx.stroke();
 const palm=seed%6===0;
 if(palm){
  ctx.strokeStyle='#2e6c30';ctx.lineWidth=5*scale;
  for(let i=0;i<7;i++){let a=i*Math.PI*2/7;ctx.beginPath();ctx.moveTo(0,-h);ctx.quadraticCurveTo(Math.cos(a)*rad*.8,-h+Math.sin(a)*rad*.5,Math.cos(a)*rad*1.65,-h+Math.sin(a)*rad*.9+6*scale);ctx.stroke()}
 }else{
  const colors=['#184d29','#226738','#307c3e','#3d8a45','#275f32'];
  for(let i=0;i<6;i++){let a=i*2.399+seed,px=Math.cos(a)*rad*.54,py=-h+Math.sin(a)*rad*.37;
   ctx.fillStyle=colors[(seed+i)%colors.length];ctx.beginPath();ctx.ellipse(px,py,rad*(.64+(i%3)*.08),rad*.58,-.25,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#4a995044';ctx.beginPath();ctx.ellipse(-rad*.3,-h-rad*.3,rad*.65,rad*.3,-.4,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function drawForest(){
 // Profundidade por escala; espaçamento e posição estáveis durante a descida.
 const offset=progress*.54;
 for(let row=0;row<19;row++){
  const y=((row*53+offset)%780)-70,b=banks(y);
  for(let side=0;side<2;side++){
   const seed=row*17+side*41;
   for(let depth=2;depth>=0;depth--){
    const x=(side===0?b.left-19-depth*27:b.right+19+depth*27)+Math.sin(seed+depth*9)*7;
    const scale=(.76+Math.max(0,y)/640*.48)*(1-depth*.16);
    tree3d(x,y,scale,seed+depth);
   }
  }
 }
}

function draw(){ctx.clearRect(0,0,480,640);ctx.fillStyle='#174c2b';ctx.fillRect(0,0,480,640);ctx.fillStyle='#245b32';for(let y=-50;y<700;y+=25){let b=banks(y);ctx.fillRect(0,y,Math.max(0,b.left),26);ctx.fillRect(b.right,y,480-b.right,26)}drawForest();ctx.beginPath();for(let y=-5;y<=645;y+=5){let b=banks(y);if(y===-5)ctx.moveTo(b.left,y);else ctx.lineTo(b.left,y)}for(let y=645;y>=-5;y-=5)ctx.lineTo(banks(y).right,y);ctx.closePath();ctx.fillStyle='#277c98';ctx.fill();ctx.strokeStyle='#c8aa71';ctx.lineWidth=8;ctx.stroke();ctx.strokeStyle='#a6e3e8';ctx.lineWidth=2;for(let j=0;j<12;j++){let y=(j*72+progress*.8)%720-50,b=banks(y);ctx.beginPath();ctx.moveTo(b.left+55,y);ctx.lineTo(b.left+85,y-10);ctx.stroke()}for(let o of objects){if(o.type==='log'){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(-.22);ctx.fillStyle='#684025';ctx.fillRect(-o.w/2,-o.h/3,o.w,o.h*.66);ctx.fillStyle='#9c6535';ctx.beginPath();ctx.ellipse(-o.w/2,0,6,o.h/3,0,0,7);ctx.fill();ctx.strokeStyle='#3d281a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(-o.w/2,0,3,o.h/5,0,0,7);ctx.stroke();ctx.strokeStyle='#b6814b';for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(-o.w/3,-5+k*5);ctx.lineTo(o.w/2-4,-5+k*5);ctx.stroke()}ctx.restore()}else{ctx.fillStyle='#808b8b';ctx.beginPath();ctx.moveTo(o.x-o.w/2,o.y+o.h/3);ctx.lineTo(o.x-o.w/3,o.y-o.h/3);ctx.lineTo(o.x+o.w/4,o.y-o.h/2);ctx.lineTo(o.x+o.w/2,o.y+o.h/3);ctx.closePath();ctx.fill();ctx.strokeStyle='#c1c8c2';ctx.stroke()}}if(finishVisible()){const fy=finishY(),fb=banks(fy);ctx.save();ctx.lineWidth=5;ctx.strokeStyle='#f5d568';ctx.beginPath();ctx.moveTo(fb.left,fy);ctx.lineTo(fb.right,fy);ctx.stroke();const squares=16,w=(fb.right-fb.left)/squares;for(let i=0;i<squares;i++){ctx.fillStyle=i%2?'#111':'#fff';ctx.fillRect(fb.left+i*w,fy-14,w,14);ctx.fillStyle=i%2?'#fff':'#111';ctx.fillRect(fb.left+i*w,fy,w,14)}ctx.fillStyle='#ffe38c';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('🏁 CHEGADA — '+stages[stageIndex][1],(fb.left+fb.right)/2,fy-22);ctx.restore()}for(let r of rivals)boat(r.x,r.y,r.color);if(shoveNoticeTime>0){ctx.save();ctx.fillStyle='#09242be6';ctx.fillRect(35,85,410,44);ctx.fillStyle=shoveFlash>0?'#fff7b5':'#ffffff';ctx.font='bold 21px system-ui';ctx.textAlign='center';ctx.fillText(shoveNotice,240,114);ctx.restore()}if(inv===0||Math.floor(inv*9)%2===0)boat(player.x,player.y,'#ffe35c',craft);ctx.fillStyle='#09242bdc';ctx.fillRect(12,12,456,45);ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.fillText(stageTitle(),22,31);ctx.font='13px system-ui';ctx.fillText('🏁 '+rank+'º/4     ★ '+score+'     '+Math.min(100,Math.floor(progress/total*100))+'%    ⏱ '+Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0'),22,49);if(state!=='playing'){ctx.fillStyle='#03171bba';ctx.fillRect(0,0,480,640);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 34px system-ui';ctx.fillText(state==='menu'?'CURRENT':state==='won'?'CHEGADA!':'FIM DE JOGO',240,290);ctx.font='19px system-ui';ctx.font='17px system-ui';ctx.fillText(state==='won'?'Chegou a '+stages[stageIndex][1]+'! Posição: '+rank+'º/4':state==='lost'?'Tente novamente!':'Enfrente a correnteza do Rio Acre',240,326);ctx.fillText(state==='won'?'Tempo: '+elapsed.toFixed(1)+'s  •  Pontos: '+score:'Clique em Iniciar ou pressione Enter',240,365);if(state==='won'){ctx.fillStyle='#ffe38c';ctx.fillText(stageIndex<stages.length-1?'Próxima: '+stages[stageIndex+1].join(' → '):'Parabéns! Você concluiu as 4 fases!',240,408);ctx.fillText(stageIndex<stages.length-1?'Pressione Enter/A ou Iniciar para avançar':'Pressione Iniciar para correr novamente',240,443)}ctx.textAlign='left'}}
function loop(t){readGamepad();let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);audioTick();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
