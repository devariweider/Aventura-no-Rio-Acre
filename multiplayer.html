<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Current — Multiplayer local</title><style>
*{box-sizing:border-box}body{margin:0;background:#071a20;color:white;font-family:system-ui;text-align:center}h1{font-size:clamp(20px,3vw,32px);color:#ffd36b;margin:10px}button,select{background:#ffd36b;color:#15202a;border:0;border-radius:8px;padding:9px;margin:5px;font-weight:bold}#setup{max-width:850px;margin:auto;padding:10px}#choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.card{border:1px solid #ffd36b;border-radius:12px;padding:12px;min-width:260px}.card label{display:block;margin:8px}#arena{display:none;gap:6px;width:min(98vw,1150px);margin:auto}section.view{flex:1;min-width:0}canvas{width:100%;height:min(75vh,650px);border:2px solid #ffd36b;border-radius:8px;display:block}#hud{margin:5px}#note{font-size:13px;color:#ffe1a1}@media(max-width:600px){#arena{flex-direction:column}canvas{height:38vh}h1{margin:4px}}</style></head><body>
<h1>🚣 CURRENT — Multiplayer local</h1><div id="setup"><p>Escolha os participantes e embarcações antes da largada. Todas têm o mesmo desempenho.</p><label>Modo: <select id="mode"><option value="2">2 jogadores — tela dividida</option><option value="1">1 jogador — treino</option></select></label><div id="choices"></div><button id="start">🏁 Iniciar corrida</button><p id="note">Jogador 1: WASD ou setas + espaço. Jogador 2: controle Xbox, direcional + X (B3) ou B (B1). Dois controles: um para cada jogador.</p><a href="index.html" style="color:#ffd36b">Voltar ao jogo original</a></div><div id="hud"></div><div id="arena"><section class="view"><canvas id="c0" width="440" height="640"></canvas><div id="h0"></div></section><section class="view" id="v1"><canvas id="c1" width="440" height="640"></canvas><div id="h1"></div></section></div><button id="again" hidden>Voltar à seleção</button>
<script>
'use strict';
const stages=[['Assis Brasil','Brasiléia'],['Brasiléia','Xapuri'],['Xapuri','Rio Branco'],['Rio Branco','Boca do Acre']];
const people=['Você','Ana','João','Lia','Davi'],crafts=[['kayak','🛶 Caiaque'],['boat','🚤 Barquinho'],['tube','🛟 Boia']];
const $=id=>document.getElementById(id),choices=$('choices'),keys={},players=[],canvases=[$('c0'),$('c1')],contexts=canvases.map(c=>c.getContext('2d'));
let running=false,stage=0,last=0,obstacles=[],spawn=0,finishTime=0,pressed=[],gpMode='keyboard',notice='';
function makeChoices(){choices.innerHTML='';for(let i=0;i<2;i++){let card=document.createElement('div');card.className='card';card.innerHTML='<strong>Jogador '+(i+1)+'</strong><label>Personagem <select id="person'+i+'">'+people.map((n,j)=>'<option value="'+j+'" '+(i===j?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label>Embarcação <select id="craft'+i+'">'+crafts.map(([v,n])=>'<option value="'+v+'">'+n+'</option>').join('')+'</select></label>';choices.append(card)}}makeChoices();
function gamepads(){return Array.from(navigator.getGamepads?.()||[]).filter(p=>p&&p.connected)}
function init(){const count=Number($('mode').value);const pads=gamepads();gpMode=pads.length>=2?'two-pads':'keyboard';players.length=0;for(let i=0;i<count;i++)players.push({x:220,y:500,world:0,score:0,shoves:0,cool:0,slow:0,inv:0,finished:false,person:people[Number($('person'+i).value)],craft:$('craft'+i).value,color:i?'#8de5ff':'#ffe35c',stun:0});stage=0;obstacles=[];spawn=0;finishTime=0;pressed=[];running=true;$('setup').hidden=true;$('arena').style.display='flex';$('v1').hidden=count===1;$('again').hidden=false;last=performance.now();requestAnimationFrame(loop)}
$('start').onclick=init;$('again').onclick=()=>{running=false;$('setup').hidden=false;$('arena').style.display='none';$('again').hidden=true};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.code==='Space'&&!e.repeat)shove(0)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function input(i,pads){let x=0,y=0,hit=false;const pad=gpMode==='two-pads'?pads[i]:i===1?pads[0]:null;if(pad){let axis=v=>Math.abs(v)>.18?v:0;let b=j=>pad.buttons[j]?.pressed||false;x=axis(pad.axes[0]||0)+Number(b(15))-Number(b(14));y=axis(pad.axes[1]||0)+Number(b(13))-Number(b(12));hit=b(3)||b(1);if(hit&&!pressed[i])shove(i);pressed[i]=hit}else if(i===0){x=Number(!!(keys.d||keys.arrowright))-Number(!!(keys.a||keys.arrowleft));y=Number(!!(keys.s||keys.arrowdown))-Number(!!(keys.w||keys.arrowup))}return{x:Math.max(-1,Math.min(1,x)),y:Math.max(-1,Math.min(1,y))}}
function center(z){return 220+55*Math.sin(z/600+stage*.4)+25*Math.sin(z/240)}function width(){return 280-stage*12}function clamp(p){p.x=Math.max(center(p.world)-width()/2+24,Math.min(center(p.world)+width()/2-24,p.x))}
function shove(i){const p=players[i];if(!running||!p||p.finished||p.cool>0)return;let target=players.find((q,j)=>j!==i&&!q.finished&&Math.abs(q.world-p.world)<105&&Math.abs(q.x-p.x)<70);if(target){p.score+=50;p.shoves++;p.cool=2;target.stun=.65;target.world=Math.max(0,target.world-80);notice=p.person+' acertou CHEGA PRA LÁ! +50';setTimeout(()=>notice='',1100)}}
function update(dt){const pads=gamepads();spawn+=dt;if(spawn>.9){spawn=0;let z=Math.max(...players.map(p=>p.world))+500;obstacles.push({z,x:center(z)+(Math.random()-.5)*(width()-70),kind:Math.random()<.5?'🪨':'🪵'})}for(let i=0;i<players.length;i++){let p=players[i];if(p.finished)continue;const v=input(i,pads),speed=165+stage*12;p.cool=Math.max(0,p.cool-dt);p.slow=Math.max(0,p.slow-dt);p.inv=Math.max(0,p.inv-dt);p.stun=Math.max(0,p.stun-dt);p.x+=v.x*205*dt;p.y=Math.max(150,Math.min(550,p.y+v.y*160*dt));p.world+=(p.slow||p.stun?speed*.55:speed)*dt;p.score+=Math.floor(dt*14);clamp(p);for(const o of obstacles)if(p.inv===0&&Math.abs(o.z-p.world)<32&&Math.abs(o.x-p.x)<29){p.slow=1.3;p.inv=1.2;p.score=Math.max(0,p.score-35)}if(p.world>=13000){p.finished=true;p.world=13000}}obstacles=obstacles.filter(o=>o.z>Math.min(...players.map(p=>p.world))-650);if(players.every(p=>p.finished)){finishTime+=dt;if(finishTime>2){if(stage<3){stage++;for(const p of players){p.world=0;p.finished=false;p.x=220;p.y=500}obstacles=[]}else{running=false;notice='🏆 Aventura concluída! '+players.slice().sort((a,b)=>b.score-a.score)[0].person+' venceu!'}}}}
function craft(ctx,p){ctx.save();ctx.translate(p.x,500);ctx.fillStyle=p.color;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();if(p.craft==='tube'){ctx.arc(0,0,24,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fillStyle='#795534';ctx.fill()}else{ctx.ellipse(0,0,p.craft==='boat'?21:13,34,0,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.fillStyle='#8d5437';ctx.beginPath();ctx.arc(0,-7,8,0,7);ctx.fill();ctx.fillStyle='#263a4a';ctx.fillRect(-9,3,18,14);ctx.restore()}
function draw(i){const p=players[i],ctx=contexts[i];ctx.clearRect(0,0,440,640);ctx.fillStyle='#24582e';ctx.fillRect(0,0,440,640);for(let y=-10;y<650;y+=5){const z=p.world+(500-y)*1.2,left=center(z)-width()/2;ctx.fillStyle='#916c41';ctx.fillRect(left,y,width(),6);ctx.fillStyle='#3c793b';ctx.fillRect(left-9,y,9,6);ctx.fillRect(left+width(),y,9,6)}for(const o of obstacles){let y=500-(o.z-p.world)/1.2;if(y>-35&&y<670){ctx.font='29px system-ui';ctx.fillText(o.kind,o.x-15,y)}}for(let j=0;j<players.length;j++){if(j===i)continue;const q=players[j],y=500-(q.world-p.world)/1.2;if(y>0&&y<640){ctx.fillStyle=q.color;ctx.beginPath();ctx.ellipse(q.x,y,14,27,0,0,7);ctx.fill();ctx.fillStyle='white';ctx.font='13px system-ui';ctx.fillText(q.person,q.x-16,y-35)}}craft(ctx,p);ctx.fillStyle='#071a20df';ctx.fillRect(0,0,440,70);ctx.fillStyle='white';ctx.font='bold 16px system-ui';ctx.fillText('Fase '+(stage+1)+' • '+stages[stage].join(' → '),12,23);ctx.font='14px system-ui';ctx.fillText(p.person+' • ★ '+p.score+' • '+Math.floor(p.world/130)+'% • 💥 '+(p.cool?p.cool.toFixed(1)+'s':'PRONTO'),12,47);if(p.finished){ctx.fillStyle='#071a20d9';ctx.fillRect(30,265,380,90);ctx.fillStyle='#ffd36b';ctx.font='bold 23px system-ui';ctx.fillText('🏁 CHEGADA!',125,310)}$('h'+i).textContent=p.person+' • '+crafts.find(c=>c[0]===p.craft)[1]+' • Empurrões: '+p.shoves}
function loop(t){if(!running)return;const dt=Math.min(.04,(t-last)/1000);last=t;update(dt);players.forEach((_,i)=>draw(i));$('hud').textContent=notice||'Teclado: jogador 1 • Controle: jogador 2 • Xbox X/B para empurrar';requestAnimationFrame(loop)}
</script></body></html>
