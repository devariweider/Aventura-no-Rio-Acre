<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Current — Multiplayer original</title><style>*{box-sizing:border-box}body{margin:0;background:#071a20;color:white;font:14px system-ui;text-align:center}h1{font-size:22px;color:#ffd36b;margin:7px}button,select{padding:9px;border:0;border-radius:7px;margin:5px;background:#ffd36b;color:#13282b}#options{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.option{border:1px solid #ffd36b;border-radius:8px;padding:9px}#arena{display:none;gap:5px;height:calc(100dvh - 76px);padding:4px}.pane{flex:1;min-width:0;position:relative;border:2px solid #ffd36b}.pane iframe{width:100%;height:100%;border:0}.label{position:absolute;z-index:2;top:2px;left:3px;background:#071a20bd;padding:3px 7px}#scores{min-height:20px}@media(max-width:650px){#arena{flex-direction:column;height:calc(100dvh - 70px)}}@media(orientation:landscape){#arena{height:calc(100dvh - 55px)}}</style></head><body><h1>🛶 CURRENT — Multiplayer Rio Acre</h1><div id="setup"><p>Mesmo cenário e mecânicas do jogo original, com duas câmeras.</p><div id="options"><div class="option">Jogador 1<br><select id="name0"><option>Você</option><option>Ana</option><option>João</option><option>Lia</option><option>Davi</option></select><select id="craft0"><option value="kayak">Caiaque</option><option value="boat">Barquinho</option><option value="tube">Boia</option></select></div><div class="option">Jogador 2<br><select id="name1"><option>Ana</option><option>João</option><option>Lia</option><option>Davi</option><option>Você</option></select><select id="craft1"><option value="kayak">Caiaque</option><option value="boat">Barquinho</option><option value="tube">Boia</option></select></div></div><button id="start">🏁 Iniciar corrida</button><p>Teclado: setas/WASD + espaço. Xbox: direcional + X/B. Dois controles: um para cada jogador.</p><a href="index.html" style="color:#ffd36b">Modo individual</a></div><div id="scores"></div><div id="arena"><div class="pane"><div class="label" id="label0">Jogador 1</div><iframe id="frame0" title="Jogador 1"></iframe></div><div class="pane"><div class="label" id="label1">Jogador 2</div><iframe id="frame1" title="Jogador 2"></iframe></div></div><script>const frames=[document.getElementById('frame0'),document.getElementById('frame1')],data=[null,null],names=[];let started=false;document.getElementById('start').onclick=()=>{started=true;document.getElementById('setup').hidden=true;document.getElementById('arena').style.display='flex';frames.forEach((f,i)=>{names[i]=document.getElementById('name'+i).value;document.getElementById('label'+i).textContent='J'+(i+1)+' — '+names[i];f.src='index.html?multi='+i;f.onload=()=>f.contentWindow.postMessage({type:'begin',name:names[i],craft:document.getElementById('craft'+i).value},'*')})};window.addEventListener('message',e=>{const d=e.data;if(!started||d?.type!=='telemetry'||![0,1].includes(d.i))return;data[d.i]=d;frames[1-d.i].contentWindow?.postMessage({type:'peer',data:d},'*');if(data[0]&&data[1]){const a=data[0],b=data[1];document.getElementById('scores').textContent='J1: '+a.score+' pontos | J2: '+b.score+' pontos • Líder: '+(a.stage>b.stage||a.stage===b.stage&&a.progress>=b.progress?names[0]:names[1])}});for(const kind of ['keydown','keyup'])window.addEventListener(kind,e=>{if(!started)return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key))e.preventDefault();frames[0].contentWindow?.postMessage({type:'key',key:e.key.toLowerCase(),down:kind==='keydown'},'*')});</script></body></html>
